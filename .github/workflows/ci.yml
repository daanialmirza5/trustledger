name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npx vitest run

      - name: Seed demo data
        run: npx tsx scripts/seed.ts

      - name: Anomaly detection evaluation
        run: npx tsx scripts/evaluate-anomaly.ts

      - name: Forecast evaluation
        run: npx tsx scripts/evaluate-forecast.ts

      - name: AI grounding evaluation
        run: npx tsx scripts/evaluate-ai.ts

      - name: Build
        run: npx next build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server for E2E
        run: npx next start -p 3210 &
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Wait for server
        run: timeout 60 bash -c 'until curl -sf http://localhost:3210/login >/dev/null; do sleep 1; done'

      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3210"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
